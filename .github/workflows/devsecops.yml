name: SIMASMUH DevOps & DevSecOps CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  devsecops-audit:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Dependency Vulnerability Audit (DevSecOps)
        run: |
          echo "Menjalankan NPM Audit untuk Backend..."
          cd backend && npm audit --audit-level=high || true
          echo "Menjalankan NPM Audit untuk Frontend..."
          cd ../frontend && npm audit --audit-level=high || true

      - name: SAST Code Analysis (Backend ESLint & Security Rules)
        run: |
          cd backend
          npm ci --ignore-scripts
          npm run lint

      - name: SAST Code Analysis (Frontend ESLint & TypeScript)
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm run lint

  build-and-test:
    name: Build & Test Compilation
    needs: devsecops-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Backend (NestJS)
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Build Frontend (Next.js)
        run: |
          cd frontend
          npm ci
          npm run build
