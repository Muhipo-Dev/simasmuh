version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: siakad_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: siakad
    ports:
      - '5432:5432'
    volumes:
      - siakad_db_data:/var/lib/postgresql/data

volumes:
  siakad_db_data:
